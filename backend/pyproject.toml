[project]
name = "prereqpath"
version = "0.10.0"
description = "Semester-by-semester degree planning for UNC Chapel Hill undergraduates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "ortools>=9.12,<10",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prereqpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
